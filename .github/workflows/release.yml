name: release

# Tag-triggered release. Push a tag like `v0.2.0` to build self-contained
# single-file binaries for every supported platform and publish them as a
# GitHub Release. The version stamped into the build is the tag minus its
# leading `v`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build & release (e.g. v0.2.0)'
        required: true
  # Called by deps.yml after a green weekly dependency bump. Calling it directly
  # (rather than relying on the pushed tag to fire the `push` trigger above) is
  # deliberate: pushes made with GITHUB_TOKEN do not start new workflow runs, so
  # the tag alone would never produce a release.
  workflow_call:
    inputs:
      tag:
        description: 'Tag to build & release (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: build + release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Check out the tag, not the branch head. On the `push` trigger these are
      # the same thing, but when dispatched by hand or called by deps.yml an
      # unpinned checkout would take the default branch and could build
      # something other than what the tag actually points at.
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build single-file binaries
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.tag.outputs.version }}"
          rm -rf dist && mkdir -p dist
          for rid in linux-x64 linux-arm linux-arm64 osx-x64 osx-arm64 win-x64; do
            echo "::group::publish $rid"
            dotnet publish src/Packet.Term/Packet.Term.csproj -c Release -r "$rid" --self-contained \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:DebugType=none -p:DebugSymbols=false \
              -p:Version="$VERSION" -p:InformationalVersion="$VERSION" \
              -o "publish/$rid"
            if [ "$rid" = "win-x64" ]; then
              mv "publish/$rid/Packet.Term.exe" "dist/packet-term-$TAG-$rid.exe"
            else
              mv "publish/$rid/Packet.Term" "dist/packet-term-$TAG-$rid"
            fi
            echo "::endgroup::"
          done
          ls -la dist

      # .debs for packet-net/apt, which mirrors every .deb on this repo's
      # releases/latest. See debian/build-deb.sh.
      - name: Build .deb packages
        run: |
          set -euo pipefail
          # Pin the changelog date to the commit being built so a rebuild of a
          # tag is byte-identical.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          for arch in amd64 arm64 armhf; do
            echo "::group::deb $arch"
            debian/build-deb.sh "${{ steps.tag.outputs.version }}" "$arch" dist
            echo "::endgroup::"
          done

      - name: Verify .deb contents
        run: |
          set -euo pipefail
          for deb in dist/*.deb; do
            echo "::group::$(basename "$deb")"
            dpkg-deb --info "$deb"
            # Capture the listing once: piping dpkg-deb into `grep -q` SIGPIPEs it,
            # which pipefail turns into a failure.
            listing="$(dpkg-deb --contents "$deb")"
            echo "$listing"
            grep -q 'usr/lib/packet-term/packet-term$' <<<"$listing"
            grep -q 'usr/bin/packet-term ->' <<<"$listing"
            grep -q 'usr/share/doc/packet-term/copyright$' <<<"$listing"
            echo "::endgroup::"
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Packet.Term ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: dist/*

      - name: Tell the apt repo to rebuild
        # Last, and only after the GitHub Release has succeeded: packet-net/apt
        # indexes whatever is on releases/latest when it runs, so dispatching
        # before the assets exist would just re-index the previous release.
        #
        # A HARD requirement, not fire-and-forget (Tom, 2026-09-18, same as the
        # other packet-net repos): if this can't notify packet-net/apt the
        # release shows red rather than shipping with apt quietly stale until
        # its daily self-heal rebuild.
        env:
          GH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::APT_DISPATCH_TOKEN is not visible to this repo - cannot notify packet-net/apt"
            exit 1
          fi
          # --input with a JSON body: gh's -f doesn't nest client_payload[...].
          payload=$(printf '{"event_type":"release-published","client_payload":{"repo":"%s","tag":"%s"}}' \
            "$GITHUB_REPOSITORY" "$TAG")
          printf '%s' "$payload" | gh api -X POST repos/packet-net/apt/dispatches --input -
